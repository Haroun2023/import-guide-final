    <script>
      /* Scroll reveals without waiting for the app bundle: elements marked
         [data-reveal] fade in once they enter the viewport. */
      (function () {
        var d = document.documentElement;
        if (!("IntersectionObserver" in window) || !("MutationObserver" in window)) return;
        d.classList.add("js");
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.setAttribute("data-in", ""); io.unobserve(e.target); }
          });
        }, { rootMargin: "0px 0px -8% 0px" });
        function watch(n) {
          if (n.nodeType !== 1) return;
          if (n.matches("[data-reveal]:not([data-in])")) io.observe(n);
          n.querySelectorAll("[data-reveal]:not([data-in])").forEach(function (el) { io.observe(el); });
        }
        new MutationObserver(function (ms) {
          ms.forEach(function (m) { m.addedNodes.forEach(watch); });
        }).observe(d, { childList: true, subtree: true });
        // Anything the visitor jumped past (anchor links, restored scroll) is shown at once.
        var queued = false;
        addEventListener("scroll", function () {
          if (queued) return;
          queued = true;
          setTimeout(function () {
            queued = false;
            document.querySelectorAll("[data-reveal]:not([data-in])").forEach(function (el) {
              if (el.getBoundingClientRect().bottom < 0) { el.setAttribute("data-in", ""); io.unobserve(el); }
            });
          }, 150);
        }, { passive: true });
      })();
    </script>
